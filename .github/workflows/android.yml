name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

# CVE-2026-114938: mitigate the affected Base64 intrinsic in the Android build JDK.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Validate, test and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
